# Acessa o banco uma vez por dia para o Supabase (plano gratuito) não pausar o projeto por inatividade.
# Lê a URL e a chave pública (anon) do config.js, então não precisa configurar segredos.
name: Ping Supabase

on:
  schedule:
    - cron: '17 11 * * *' # todo dia às 08:17 (Brasília)
  workflow_dispatch: # também dá para rodar na mão: aba Actions > Ping Supabase > Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chamar listar_aulas
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Não achei URL/chave no config.js"; exit 1; fi
          CODE=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$URL/rest/v1/rpc/listar_aulas" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $CODE"
          head -c 300 /tmp/resp.json; echo
          [ "$CODE" = "200" ]
